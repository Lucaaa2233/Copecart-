name: HomeFit
options:
  bundleIdPrefix: de.homefit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Hier deine Apple-Team-ID eintragen (oder später in Xcode unter "Signing & Capabilities" wählen)
    DEVELOPMENT_TEAM: ""
targets:
  HomeFit:
    type: application
    platform: iOS
    sources:
      - HomeFit
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.homefit.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: HomeFit/HomeFit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: HomeFitWidget
  HomeFitWidget:
    type: app-extension
    platform: iOS
    sources:
      - HomeFitWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.homefit.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeFit
        CODE_SIGN_ENTITLEMENTS: HomeFitWidget/HomeFitWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HomeFitWidget/Info.plist
      properties:
        CFBundleDisplayName: HomeFit
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
